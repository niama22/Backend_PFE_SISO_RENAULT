name: CI - client-service (NestJS)

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # ── 1. Récupérer le code ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/client-service/package-lock.json

      # ── 3. Installer les dépendances ─────────────────────────────────
      - name: Install dependencies
        working-directory: services/client-service
        run: npm ci

      # ── 4. Lint (vérifie la qualité du code) ─────────────────────────
      - name: Lint
        working-directory: services/client-service
        run: npm run lint
        continue-on-error: false

      # ── 5. Tests unitaires ───────────────────────────────────────────
      - name: Unit tests
        working-directory: services/client-service
        run: npm test

      # ── 6. Tests avec couverture de code ────────────────────────────
      - name: Test coverage
        working-directory: services/client-service
        run: npm run test:cov
        continue-on-error: true   # ne bloque pas le CI mais affiche le rapport

      # ── 7. Build NestJS ──────────────────────────────────────────────
      - name: Build (Nest)
        working-directory: services/client-service
        run: npm run build

      # ── 8. Build images Docker ───────────────────────────────────────
      - name: Docker build (client-service)
        run: docker build -t siso/client-service:ci ./services/client-service

      - name: Docker build (kong)
        run: docker build -t siso/kong:ci ./kong

      # ── 9. Scan de sécurité des images (Trivy) ───────────────────────
      - name: Security scan - client-service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: siso/client-service:ci
          format: table
          exit-code: "0"          # 0 = affiche les vulnérabilités sans bloquer
          severity: CRITICAL,HIGH

      - name: Security scan - kong
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: siso/kong:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH